<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전시 적층(Layers) - 인터랙티브 도면</title>
    <style>
        :root {
            /* 호버 시 채워질 색상 (투명도 조절 가능) */
            --individual-fill: rgba(0, 255, 255, 0.5); /* 민트 */
            --duo-fill: rgba(255, 255, 0, 0.5);        /* 노랑 */
            --trio-fill: rgba(255, 0, 255, 0.5);       /* 보라 */
            --border-color: #000000; /* 평소 선 색상 */
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0; padding: 40px;
        }

        .header { text-align: left; width: 100%; max-width: 900px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.05rem; }

        /* 도면 컨테이너 */
        .floorplan-container {
            position: relative;
            width: 900px; /* 도면의 실제 가로 세로 비율에 맞춰 조절하세요 */
            height: 900px; 
            border: 1px solid #eee;
        }

        .floorplan-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            /* 실제 도면 이미지 경로를 넣으세요 */
            background-image: url('your-floorplan-image.jpg'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* 작품 구획 (정적 상태) */
        .spot {
            position: absolute;
            z-index: 2;
            cursor: pointer;
            border: 1px solid var(--border-color); /* 검정색 1px 실선 */
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #000;
            background-color: transparent; /* 평소엔 투명 */
        }

        /* 호버 시 그룹별 하이라이트 클래스 (JS로 제어) */
        .spot.active-individual { background-color: var(--individual-fill); border-color: cyan; }
        .spot.active-duo { background-color: var(--duo-fill); border-color: gold; }
        .spot.active-trio { background-color: var(--trio-fill); border-color: magenta; }

        /* --------------------------------------------------
           [수정 가이드] 여기서 좌표와 크기를 직접 수정하세요!
           top(위에서 거리), left(왼쪽에서 거리), width(가로), height(세로)
           모두 % 단위이므로 도면 크기가 바뀌어도 비율이 유지됩니다.
        -------------------------------------------------- */

        /* 개인작 (Individual) */
        .ind-1 { top: 20%; left: 33%; width: 8%; height: 18%; }
        .ind-2 { top: 48%; left: 12%; width: 10%; height: 25%; }
        .ind-3 { top: 55%; left: 82%; width: 9%; height: 28%; }

        /* 2인 협업작 (Duo) */
        .duo-1 { top: 18%; left: 52%; width: 12%; height: 22%; }
        .duo-2 { top: 38%; left: 48%; width: 14%; height: 20%; }
        .duo-3 { top: 32%; left: 78%; width: 13%; height: 18%; }

        /* 3인 공동작 (Trio) */
        .trio-1 { top: 42%; left: 42%; width: 25%; height: 25%; }

        /* -------------------------------------------------- */

        .legend {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            border-top: 1px solid #000;
            padding-top: 20px;
        }
        .leg-item { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
        .box { width: 15px; height: 15px; border: 1px solid #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1>적층 (Layers): EXHIBITION FLOORPLAN</h1>
    </div>

    <div class="floorplan-container">
        <div class="floorplan-img"></div>

        <div class="spot ind-1" data-group="individual">1</div>
        <div class="spot ind-2" data-group="individual">1</div>
        <div class="spot ind-3" data-group="individual">1</div>

        <div class="spot duo-1" data-group="duo">2</div>
        <div class="spot duo-2" data-group="duo">2</div>
        <div class="spot duo-3" data-group="duo">2</div>

        <div class="spot trio-1" data-group="trio">3</div>
    </div>

    <div class="legend">
        <div class="leg-item"><div class="box" style="background: var(--individual-fill);"></div> 개인작</div>
        <div class="leg-item"><div class="box" style="background: var(--duo-fill);"></div> 2인 협업작</div>
        <div class="leg-item"><div class="box" style="background: var(--trio-fill);"></div> 3인 공동작</div>
    </div>

    <script>
        const spots = document.querySelectorAll('.spot');

        spots.forEach(spot => {
            const group = spot.getAttribute('data-group');

            spot.addEventListener('mouseenter', () => {
                // 같은 그룹명을 가진 모든 요소를 찾아 하이라이트 클래스 추가
                document.querySelectorAll(`[data-group="${group}"]`).forEach(el => {
                    el.classList.add(`active-${group}`);
                });
            });

            spot.addEventListener('mouseleave', () => {
                // 하이라이트 클래스 제거
                document.querySelectorAll(`[data-group="${group}"]`).forEach(el => {
                    el.classList.remove(`active-${group}`);
                });
            });
        });
    </script>
</body>
</html>
