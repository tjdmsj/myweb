<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전시 적층(Layers) - 인터랙티브 도면</title>
    <style>
        :root {
            --individual-color: rgba(0, 255, 255, 0.4); /* 개인작: 민트색 계열 */
            --duo-color: rgba(255, 255, 0, 0.4);       /* 2인 협업: 노란색 계열 */
            --trio-color: rgba(255, 0, 255, 0.4);      /* 공동작: 보라색 계열 */
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Pretendard', sans-serif;
            margin: 0; padding: 40px;
        }

        .header { text-align: left; width: 100%; max-width: 800px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 2.5rem; }
        p { color: #666; }

        /* 도면 컨테이너 */
        .floorplan-container {
            position: relative;
            width: 800px; /* 도면 이미지 크기에 맞춰 조정 */
            height: 800px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .floorplan-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 여기에 실제 도면 이미지 파일명을 넣으세요 */
            background-image: url('도면이미지파일경로.jpg'); 
            background-size: cover;
        }

        /* 호버 감지 영역 (Hotspots) */
        .spot {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: transparent;
            border: 1px solid transparent;
        }

        /* 호버 시 같은 그룹 전체 하이라이트 */
        .spot.highlight-individual { background-color: var(--individual-color); border: 1px solid cyan; color: #000; }
        .spot.highlight-duo { background-color: var(--duo-color); border: 1px solid gold; color: #000; }
        .spot.highlight-trio { background-color: var(--trio-color); border: 1px solid magenta; color: #000; }

        /* 위치 예시 (도면에 맞춰 %값 수정 필요) */
        /* 개인작 3개 */
        .ind-1 { top: 20%; left: 35%; width: 10%; height: 20%; }
        .ind-2 { top: 50%; left: 10%; width: 12%; height: 30%; }
        .ind-3 { top: 60%; left: 80%; width: 10%; height: 30%; }

        /* 2인 협업작 3개 */
        .duo-1 { top: 15%; left: 55%; width: 15%; height: 25%; }
        .duo-2 { top: 40%; left: 45%; width: 15%; height: 25%; }
        .duo-3 { top: 35%; left: 75%; width: 15%; height: 20%; }

        /* 3인 공동작 1개 */
        .trio-1 { top: 45%; left: 40%; width: 30%; height: 30%; }

        /* 하단 캡션 */
        .caption {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }
        .cap-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .dot { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>적층 (Layers)</h1>
        <p>Layers of Existence: 도면 위의 작품을 호버하여 층위를 확인하세요.</p>
    </div>

    <div class="floorplan-container">
        <div class="floorplan-img"></div>

        <div class="spot ind-1" data-group="individual">개인 1</div>
        <div class="spot ind-2" data-group="individual">개인 2</div>
        <div class="spot ind-3" data-group="individual">개인 3</div>

        <div class="spot duo-1" data-group="duo">2인 A</div>
        <div class="spot duo-2" data-group="duo">2인 B</div>
        <div class="spot duo-3" data-group="duo">2인 C</div>

        <div class="spot trio-1" data-group="trio">공동 퍼포먼스</div>
    </div>

    <div class="caption">
        <div class="cap-item"><div class="dot" style="background: cyan;"></div> 개인작 (Individual)</div>
        <div class="cap-item"><div class="dot" style="background: gold;"></div> 2인 협업 (Collaboration)</div>
        <div class="cap-item"><div class="dot" style="background: magenta;"></div> 3인 공동 (Collective)</div>
    </div>

    <script>
        const spots = document.querySelectorAll('.spot');

        spots.forEach(spot => {
            spot.addEventListener('mouseenter', () => {
                const group = spot.getAttribute('data-group');
                // 같은 그룹 전체에 클래스 추가
                document.querySelectorAll(`[data-group="${group}"]`).forEach(el => {
                    el.classList.add(`highlight-${group}`);
                });
            });

            spot.addEventListener('mouseleave', () => {
                const group = spot.getAttribute('data-group');
                // 같은 그룹 전체에서 클래스 제거
                document.querySelectorAll(`[data-group="${group}"]`).forEach(el => {
                    el.classList.remove(`highlight-${group}`);
                });
            });
        });
    </script>
</body>
</html>
